{% extends "base.html" %}

{% block title %}Password updated — Crelume{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="container auth-page__inner">
    <div class="auth-card auth-card--center">
      <p class="eyebrow">Updated</p>
      <h1 class="auth-title">Your password is set</h1>
      <p class="auth-lead">You can now sign in with your new password.</p>
      <a class="btn btn--primary btn--block" href="{% url 'account_login' %}">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
